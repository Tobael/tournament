name: tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Audit dependency lockfiles
        run: |
          composer audit
          npm audit

      - name: Build Assets
        run: npm run build

      - name: Run Tests
        run: ./vendor/bin/pest
      - name: Set up Docker BuildKit
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        run: docker build --tag tournament:ci .

      - name: Smoke test a fresh installation without external networking
        run: docker run --rm --network none --entrypoint sh --mount type=bind,src="$PWD/deploy/smoke.sh",dst=/tmp/smoke.sh,readonly tournament:ci /tmp/smoke.sh
