name: Deploy tournament
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tournament-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_HOST: ${{ secrets.SSH_HOST }}
      DEPLOY_USER: ${{ secrets.SSH_USER }}
    steps:
      - uses: actions/checkout@v4
      - name: Connect WireGuard
        env:
          WIREGUARD_CONF: ${{ secrets.WIREGUARD_CONF }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wireguard-tools
          sudo ln -sf "$(command -v resolvectl)" /usr/local/bin/resolvconf
          umask 077
          printf '%s' "$WIREGUARD_CONF" > "$RUNNER_TEMP/wg0.conf"
          sudo wg-quick up "$RUNNER_TEMP/wg0.conf"
      - name: Configure SSH with trusted host keys
        env:
          DEPLOY_SECRET_KEY: ${{ secrets.DEPLOY_SECRET_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DEPLOY_SECRET_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
      - name: Synchronize source, preserving runtime state
        run: |
          set -euo pipefail
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p ~/mtg/data ~/mtg/backups'
          rsync -az --delete --delete-delay \
            --exclude='/.env*' --exclude='/auth.json' --exclude='/secrets/' \
            --exclude='/data/' --exclude='/backups/' --exclude='/storage/' \
            --exclude='/database/*.sqlite*' --exclude='/vendor/' --exclude='/node_modules/' \
            --exclude='/public/build/' --exclude='/public/hot' \
            --exclude='/.git/' --exclude='/.agents/' --exclude='/.aws/' --exclude='/.codex/' \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:mtg/"
      - name: Stage private configuration
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$ENV_FILE"
          printf '%s\n' "$ENV_FILE" | ssh "$DEPLOY_USER@$DEPLOY_HOST" 'cd ~/mtg && umask 077 && cat > .env.new && mv .env.new .env'
      - name: Build, back up, migrate and verify
        run: |
          set -euo pipefail
          ssh -n "$DEPLOY_USER@$DEPLOY_HOST" 'bash ~/mtg/deploy/remote.sh'
      - name: Disconnect WireGuard
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/wg0.conf" ]; then
            sudo wg-quick down "$RUNNER_TEMP/wg0.conf" || true
          fi
