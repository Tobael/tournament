name: mtg
services:
  laravel:
    restart: unless-stopped
    container_name: magic_tournament
    env_file: .env
    build:
      context: .
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/runtime/tournament.sqlite
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: 'true'
      SESSION_LIFETIME: 43200
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-tournament}
      REVERB_APP_KEY: ${REVERB_APP_KEY:?Set REVERB_APP_KEY in .env}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:?Set REVERB_APP_SECRET in .env}
      REVERB_HOST: 127.0.0.1
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      REVERB_SERVER_HOST: 127.0.0.1
      REVERB_SERVER_PORT: 8080
      REVERB_BROWSER_PORT: ''
      REVERB_ALLOWED_ORIGINS: ${TOURNAMENT_HOST:-mtg.betz.coffee}
    volumes:
      - ./data/storage:/var/www/html/storage/app
      - ./data/database:/var/www/html/database/runtime
    networks:
      - external_network
    healthcheck:
      test: [CMD-SHELL, 'curl -fs http://127.0.0.1/up >/dev/null']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.docker.network=external_network
      - traefik.http.routers.mtg.rule=Host(`${TOURNAMENT_HOST:-mtg.betz.coffee}`)
      - traefik.http.routers.mtg.entrypoints=websecure
      - traefik.http.routers.mtg.tls=true
      - traefik.http.routers.mtg.tls.certresolver=externalresolver
      - traefik.http.routers.mtg.service=mtg
      - traefik.http.routers.mtg.middlewares=security-headers@file
      - traefik.http.services.mtg.loadbalancer.server.port=80
networks:
  external_network:
    external: true
    name: external_network
